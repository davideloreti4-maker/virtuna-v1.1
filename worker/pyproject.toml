[project]
name = "maven-edit-worker"
version = "0.1.0"
description = "The edit tool's worker: analyses takes and renders films."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.43.125",
    "botocore==1.43.125",
    "num2words==0.5.14",
    "requests==2.32.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
